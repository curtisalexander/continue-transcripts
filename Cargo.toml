[package]
name = "continue-transcripts"
version = "0.1.0"
edition = "2021"
description = "Convert continue.dev session files to readable HTML transcripts"
license = "MIT"

[[bin]]
name = "continue-transcripts"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
html-escape = "0.2"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
syntect = "5"
